name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    - name: install packages
      run: sudo apt-get install -y python3-pip cmake ninja-build git build-essential pkg-config
    - name: Install python libs
      run: pip3 install --user "conan>=2.7.0"
    - name: build curaengine executable
      run: bash scripts/build_cura_android.sh
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
